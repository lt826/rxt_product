server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rxt?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  jackson:
    time-zone: GMT+8

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      port: 6379
      host: localhost

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: MojuanSecretKey2026!@#YourVeryLongSecretStringToGenerateToken
  expiration: 86400000

# 文件上传配置（本地存储目录，相对于运行目录）
app:
  upload:
    dir: ./uploads

# 支付宝沙箱配置（请替换为你自己的沙箱应用凭证）
# 未填写真实凭证时，二维码预下单会失败，但订单结算页的「已完成支付」按钮仍可正常走通
alipay:
  appId: 9021000158697944
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  merchant-private-key: ''
  alipay-public-key: ''
  sign-type: RSA2
  charset: UTF-8
  format: json
