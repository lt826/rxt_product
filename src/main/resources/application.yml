server:
  port: 9090
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rongxiaotong?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=UTF-8&useSSL=false
    username: root
    password: 123456
  jackson:
    time-zone: GMT+8
  # 【修改点】redis移到data下
  data:
    redis:
      host: localhost
      port: 6379
      # 可选补充：无密码可删除，有密码填对应值
      # password: 123456
      # database: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  web:
    resources:
      static-locations: file:${application.upload-path}
  mvc:
    static-path-pattern: file:d:/wangyanan/file/order,file:d:/wangyanan/file/avatar,file:d:/wangyanan/file/video
application:
  name: uploadService8007
  upload-path: d:/wangyanan/file

# PageHelper 配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

#mybatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

#nginx存放图片的路径
file:
  location:
    directory: /usr/local/learn/docker/nginx/html/
# 支付宝 appId,私钥,支付宝公钥
alipay:
  info:
    appId:
    privateKey:
    alipayPublicKey: